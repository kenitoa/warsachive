name: Sync published archive index

on:
  push:
    branches: [main]
    paths:
      - "web/content/archive/**/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Generate published content index
        run: npm run content:sync
      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- web/content/main.json; then
            echo "content/main.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/main.json
          git commit -m "chore: sync published archive index [skip ci]"
          git push origin HEAD:main
