name: Validate archive changes

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Install Korean sharing-card fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run content:gate
      - name: Build static test site
        run: npm run build
        env:
          ARCHIVE_BUILD_PROFILE: preview
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4200
      - run: npm run test:static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:isolated
        env:
          ARCHIVE_TEST_API: "true"
      - name: Bundle Android application
        run: npm run build:android --workspace @war-archive/mobile
        env:
          EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            playwright-report
            artifacts/browser
            test-results
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API runtime
        run: docker build -f infrastructure/docker/Dockerfile.api -t war-archive-api:ci .
      - name: Verify non-root container and readiness
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint id war-archive-api:ci -u)" != "0"
          session_secret=$(openssl rand -hex 32)
          encryption_key=$(openssl rand -hex 32)
          docker run -d --name archive-ci --read-only --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:4200:4200 -e ARCHIVE_API_SESSION_SECRET="$session_secret" -e ARCHIVE_SECURITY_ENCRYPTION_KEY="$encryption_key" -e ARCHIVE_API_ALLOWED_ORIGINS=https://archive.example.org -e ARCHIVE_API_PUBLIC_URL=https://archive.example.org war-archive-api:ci
          trap 'docker stop -t 30 archive-ci >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4200/health/ready > /tmp/archive-health.json; then
              node -e 'const value=require("/tmp/archive-health.json"); if(value.data.status!=="ready" || value.data.capabilities.payments) process.exit(1)'
              exit 0
            fi
            sleep 1
          done
          docker logs archive-ci
          exit 1
