name: Deploy front to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mobile/**"
      - "api/**"
      - "scripts/**"
      - "infrastructure/**"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "eslint.config.mjs"
      - "playwright.config.ts"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: "Optional full 40-character SHA of a previously approved compatible release"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_PUBLICATION_VERIFY_SECRET: ${{ secrets.ARCHIVE_PUBLICATION_VERIFY_SECRET }}
      ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET: ${{ secrets.ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET }}
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      site_url: ${{ steps.version.outputs.site_url }}
    steps:
      - name: Validate rollback reference
        shell: bash
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          if [[ -n "$ROLLBACK_REF" && ! "$ROLLBACK_REF" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "rollback_ref must be a full commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.rollback_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Record release version
        id: version
        shell: bash
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sha=$(git rev-parse HEAD)
          site_url=${CONFIGURED_SITE_URL:-$PAGES_BASE_URL}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=$site_url" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Load configured signed editorial publication
        shell: bash
        env:
          APPROVED_JSON: ${{ secrets.ARCHIVE_APPROVED_EXPORT_JSON }}
          VERIFY_KEY: ${{ secrets.ARCHIVE_PUBLICATION_VERIFY_SECRET }}
          EVIDENCE_KEY: ${{ secrets.ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile, appendFile } from 'node:fs/promises';
          const configured = [process.env.APPROVED_JSON, process.env.VERIFY_KEY, process.env.EVIDENCE_KEY];
          if (configured.some(Boolean)) {
            if (!configured.every(Boolean)) throw new Error('Configure all three signed-publication secrets together.');
            JSON.parse(process.env.APPROVED_JSON);
            await writeFile('/tmp/archive-approved-publication.json', process.env.APPROVED_JSON, { mode: 0o600, flag: 'wx' });
            await appendFile(process.env.GITHUB_ENV, 'ARCHIVE_APPROVED_EXPORT_FILE=/tmp/archive-approved-publication.json\n');
          }
          JS
      - name: Install Korean sharing-card fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run content:gate
      - name: Build public archive
        run: npm run build --workspace @war-archive/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          ARCHIVE_PUBLICATION_VERIFY_SECRET: ${{ secrets.ARCHIVE_PUBLICATION_VERIFY_SECRET }}
      - name: Observe signed publication build
        env:
          ARCHIVE_PUBLICATION_VERIFY_SECRET: ${{ secrets.ARCHIVE_PUBLICATION_VERIFY_SECRET }}
          ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET: ${{ secrets.ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET }}
        run: |
          if [ -n "$ARCHIVE_APPROVED_EXPORT_FILE" ]; then
            mkdir -p /tmp/archive-publication-evidence
            node --experimental-strip-types scripts/publication-evidence.mjs build /tmp/archive-publication-evidence/build.json
          fi
      - name: Retain private build observation
        uses: actions/upload-artifact@v4
        with:
          name: signed-publication-build
          path: /tmp/archive-publication-evidence/build.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm run test:static
      - name: Install browser verification runtime
        run: npx playwright install --with-deps chromium
      - name: Verify production Pages paths in browser
        run: npm run test:browser
        env:
          ARCHIVE_PREVIEW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Assemble Pages artifact
        run: |
          touch web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published release and key URLs
        run: node web/scripts/post-deploy-smoke.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ needs.build.outputs.site_url }}
          ARCHIVE_RELEASE_SHA: ${{ needs.build.outputs.sha }}
      - name: Observe current public publication and feed
        env:
          APPROVED_JSON: ${{ secrets.ARCHIVE_APPROVED_EXPORT_JSON }}
          ARCHIVE_PUBLICATION_VERIFY_SECRET: ${{ secrets.ARCHIVE_PUBLICATION_VERIFY_SECRET }}
          ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET: ${{ secrets.ARCHIVE_DEPLOYMENT_EVIDENCE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ needs.build.outputs.site_url }}
          ARCHIVE_RELEASE_SHA: ${{ needs.build.outputs.sha }}
          ARCHIVE_APPROVED_EXPORT_FILE: /tmp/archive-approved-publication.json
        run: |
          if [ -n "$APPROVED_JSON" ]; then
            node --input-type=module -e 'import {writeFile} from "node:fs/promises"; await writeFile(process.env.ARCHIVE_APPROVED_EXPORT_FILE, process.env.APPROVED_JSON, {mode:0o600,flag:"wx"})'
            mkdir -p /tmp/archive-publication-evidence
            node --experimental-strip-types scripts/publication-evidence.mjs deploy /tmp/archive-publication-evidence/deploy-feed.json
          fi
      - name: Retain private deployment and feed observations
        uses: actions/upload-artifact@v4
        with:
          name: signed-publication-deploy-feed
          path: /tmp/archive-publication-evidence/deploy-feed.json
          if-no-files-found: ignore
          retention-days: 3
